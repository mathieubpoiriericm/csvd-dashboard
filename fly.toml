# Fly.io: eight always-on machines, four in Paris and four in Toronto, serving
# the Dockerfile's image.
# `app` is also the host name, <app>.fly.dev; a fork changes it (and may change
# the region) before `fly launch --no-deploy --copy-config`. The deploy skill
# (.claude/skills/deploy/SKILL.md) has the setup and the diagnosis.
app = "csvd-dashboard"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly's proxy is the only way in, and it puts the visitor's address here.
  # Unset, the login limiter would key every visitor on the proxy's address,
  # and five wrong guesses from anyone would lock out everyone
  # (server/login_post_limiter.ts).
  LOGIN_CLIENT_IP_HEADER = "Fly-Client-IP"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on. The login limiter's counters live in the server process, so
  # each machine counts on its own and a stopped one would forget its count:
  # with N machines a visitor can spend up to N times the per-client budget,
  # and the global limit is N times 64 a minute. The machine count is set on
  # Fly, not here (eight since 10 November 2026). CI deploys with --ha=false,
  # which only keeps a first deploy from creating two machines by default.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Liveness only. Fly's checks pass on a 2xx and follow no redirect, and
  # /login is the one page that answers 200 without a session, because the
  # gate exempts it before reading the secrets: it answers 200 even with a
  # login secret unset. Whether the secrets are set is what CI's deploy job
  # asks next, through scripts/smoke_deploy.sh, which wants a logged-out
  # GET / to redirect to /login rather than answer 503.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/login"
    timeout = "5s"

# One volume per machine: a volume attaches to a single machine and is not
# shared, so what one machine writes here no other machine sees. Each machine
# takes a volume of this name in its own region, created by hand before the
# machine (`fly volumes create persistent_session_storage --region <region>`).
# Nothing in the app writes to it yet. The image runs as the `deno` user and a
# fresh volume's root belongs to root, so whatever writes here first has to
# own the directory.
[mounts]
  source = "persistent_session_storage"
  destination = "/session_storage"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  processes = ["app"]
