# Fly.io: one always-on machine in Paris serving the Dockerfile's image.
# `app` is also the host name, <app>.fly.dev; a fork changes it (and may change
# the region) before `fly launch --no-deploy --copy-config`. The deploy skill
# (.claude/skills/deploy/SKILL.md) has the setup and the diagnosis.
app = "csvd-dashboard"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly's proxy is the only way in, and it puts the visitor's address here.
  # Unset, the login limiter would key every visitor on the proxy's address,
  # and five wrong guesses from anyone would lock out everyone
  # (server/login_post_limiter.ts).
  LOGIN_CLIENT_IP_HEADER = "Fly-Client-IP"
  # The adaptation guide's saved sessions, on the volume [mounts] puts at
  # /session_storage. Unset, or unwritable, the guide still works but cannot
  # save on the server (server/adapt_sessions.ts), and the deploy job's smoke
  # test fails for it.
  ADAPT_SESSIONS_DIR = "/session_storage/adapt-sessions"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on, and exactly one machine. The login limiter's counters live in
  # the server process, so a second machine would double the guess budget and
  # a stopped one would forget it. CI deploys with --ha=false, which keeps
  # the first deploy from creating the two machines Fly makes by default.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Liveness only. Fly's checks pass on a 2xx and follow no redirect, and
  # /login is the one page that answers 200 without a session, because the
  # gate exempts it before reading the secrets: it answers 200 even with a
  # login secret unset. Whether the secrets are set is what CI's deploy job
  # asks next, through scripts/smoke_deploy.sh, which wants a logged-out
  # GET / to redirect to /login rather than answer 503.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/login"
    timeout = "5s"

# The machine's one volume, 1 GB, created by hand before the machine
# (`fly volumes create persistent_session_storage --region cdg --size 1`).
# A volume attaches to a single machine and is not shared, so a second machine
# would need a volume of its own and would not see what this one holds.
# It holds the adaptation guide's saved sessions, in ADAPT_SESSIONS_DIR above:
# one JSON file each, named by a hash of its resume code, deleted 14 days
# after its last save. A fresh volume's root belongs to root and the server
# runs as `deno`, so the image starts as root and its entrypoint
# (scripts/docker-entrypoint.sh) creates that directory, hands it to `deno`,
# and only then drops to `deno` to serve. Before adding a machine, set
# ADAPT_SESSIONS_MACHINE to the id of the one that holds these files
# (server/adapt_session_holder.ts): no other machine can see them.
[mounts]
  source = "persistent_session_storage"
  destination = "/session_storage"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
