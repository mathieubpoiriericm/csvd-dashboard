[project]
name = "csvd-dashboard-pipeline"
version = "1.0.0"
description = "Data pipeline for the cSVD dashboard: PubMed ingest, LLM gene extraction, and external-data sync into PostgreSQL."
# .python-version pins uv to 3.14. Without it a fresh environment -- every CI
# runner -- takes the newest CPython this range admits, and on 3.15 `uv sync`
# fails outright: onnxruntime (via docling[rapidocr]) publishes no cp315 wheel
# and no sdist, and torch has none on PyPI for macOS. Raise the pin once both do.
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "apprise>=2.1.0",
    "argcomplete>=3.7.2",
    "asyncpg>=0.32.0",
    "biopython>=1.88",
    "certifi>=2026.10.23",
    # Docling serves the PDF fallback -- the ~15% of papers Europe PMC's JATS
    # XML does not reach. The [rapidocr] extra adds onnxruntime so the OCR
    # backend is real: rapidocr already ships inside docling-slim[standard],
    # but without a runtime docling logs "No OCR engine found" once and then
    # silently emits no OCR text at all. It is a hard requirement because a
    # fallback path CI cannot import is a fallback path nobody has proven.
    # For the torch footprint this pulls, see [tool.uv.sources] below.
    "docling[rapidocr]>=2.142.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "pandera>=0.35.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.6",
    "tenacity>=9.2.1",
    # torch and torchvision arrive transitively, through
    # docling-slim[standard] -> models-local. They are named here only so
    # [tool.uv.sources] can reach them: uv applies a source override to direct
    # dependencies, never to transitive ones, so without these two lines the
    # pytorch-cpu index below is silently ignored and Linux resolves the CUDA
    # wheel anyway. Versions must stay inside docling-ibm-models' own range
    # (torch>=2.2.2,<3.0.0) -- bump them with docling, not on their own.
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    # `TypedDict(..., closed=True)` (PEP 728) is a TypeError in 3.14's typing;
    # typing_extensions carries it and re-exports typing's own on 3.15. Drop
    # this, and import TypedDict from typing, once requires-python is >=3.15.
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "lxml-stubs>=0.5.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-recording>=0.14.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
    "types-pyyaml>=6.0.12.20260906",
]
# Print renderers for both figures: scripts/timeline_figure.py (pyCirclize)
# and scripts/phenogram_figure.py (matplotlib). matplotlib is not a base
# dependency -- it arrives transitively through pyCirclize -- so this group is
# what `deno task figure` and tests/scripts/ need. CI installs it alongside
# --group dev for exactly that reason.
figure = [
    "pycirclize>=1.10.1",
]

# Linux CI would otherwise take PyPI's default torch wheel: 526 MB, plus
# nvidia-cudnn/nccl/nvshmem/cusparselt and triton -- roughly 2.5 GB of CUDA a
# GitHub runner never uses. The PyTorch CPU index serves the identical pinned
# versions (torch 2.14.1+cpu, torchvision 0.29.1+cpu; PEP 440 ignores the
# local segment, so `>=2.14.1` still matches), making this a wheel swap rather
# than a downgrade. macOS is deliberately excluded: its arm64 wheels are
# already CPU/MPS-only and carry no nvidia dependencies.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform >= 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform >= 'linux'" }]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["pipeline"]
extend-exclude = ["pipeline/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E = pycodestyle errors, F = pyflakes, I = isort
# UP = pyupgrade, B = flake8-bugbear, SIM = flake8-simplify

[tool.ruff.lint.per-file-ignores]
# LLM prompt strings — line wrapping breaks readability
"pipeline/prompts.py" = ["E501"]
# Fast-path for shell tab-completion requires heavy imports to load lazily
# after argparse parsing, so module-level imports appear mid-file by design.
"pipeline/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests/pipeline"]
# The repo root must be on sys.path so `pipeline` resolves as a top-level
# package. tests/pipeline/ deliberately carries no __init__.py: that would
# make pytest put tests/ on sys.path ahead of the root and shadow the real
# package with the test package of the same name.
pythonpath = ["."]
# Most async tests carry no explicit @pytest.mark.asyncio marker.
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "live: hits the real Anthropic API; requires ANTHROPIC_API_KEY",
    "paper_fixtures: reads the gitignored full-text fixtures under tests/pipeline/fixtures/papers/",
    "golden_cassettes: reads the gitignored cassettes under tests/pipeline/cassettes/test_extraction_golden/",
]

[tool.coverage.report]
# main() is tested directly; the module-execution guards themselves contain no
# application behavior and cannot run during an imported pytest session.
exclude_also = ["if __name__ == .__main__.:"]
fail_under = 99.5
precision = 2
show_missing = true
skip_covered = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# Third-party packages may not have type stubs available
unresolved-import = "warn"

[tool.pyrefly]
project-includes = ["**/*.py"]
python-version = "3.14"
