name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository; a read-only token is what a fork's
# pull request should be able to reach.
permissions:
  contents: read

# Where the five test jobs run. A repository that sets the CI_RUNNER variable
# sends them to the self-hosted runners carrying that label -- this project's
# private repository does, to the mini PC the `ci-runner` skill describes.
# Every repository without it -- the public one, a disease fork, a fork's pull
# request -- stays on ubuntu-latest. The runners are registered to the private
# repository alone, so no other repository's job can reach them whatever its
# workflow file says. Deleting the variable is the fallback when the machine is
# down; a job waiting for an offline runner queues for a day.
#
# One machine runs several of these jobs at once, so none of them takes a fixed
# host port: each runner sets its own E2E_PORT, and the database tests there use
# a database of the runner's own on the machine's native PostgreSQL rather than
# a postgres service (see the python job). Caching and Playwright's system
# packages are decided on runner.environment. The container and deploy jobs stay on GitHub-hosted
# runners, and must: on a push to main both hold FLY_API_TOKEN -- container to
# push the image, deploy to release it -- so moving either to vars.CI_RUNNER
# would put the token on that machine. They are short and off the critical
# path anyway.
#
# On that machine twelve jobs run at once -- empty-data and adapt-fork are
# split by gate family (Deno, Python, e2e) so no job runs the three in a row --
# and they share 16 cores. The e2e jobs are the critical path, so every Deno
# and Python command runs under `nice -n 15` (the $NICE prefix) and gives way
# to the browsers when the machine is full. The parallelism is deliberately
# moderate: 4 Playwright workers per e2e suite and at most 4 pytest workers,
# with Deno's tests serial (tests/deno_parallel_isolation_test.ts says why).
# Every knob at its maximum ran slower than the unsplit layout and left the
# e2e suite flaky, because starved pages time out; the `ci-runner` skill has
# the measurements. The worker count comes from vars.CI_RUNNER, so a
# repository without it keeps Playwright's 2 workers, and nice and pytest's
# `-n auto` are harmless on a VM of one's own.
jobs:
  check:
    name: Format, lint, type-check, unit tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NICE: nice -n 15
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # nodeModulesDir is "manual", so node_modules must be populated
      # explicitly before anything type-checks.
      - name: Install dependencies
        run: deno install

      - name: Check
        run: $NICE deno task check

      # Browser-only effects are exercised by Playwright below. Deno coverage
      # gates the full SSR/unit graph and requires 100% in shared lib/ logic.
      - name: Unit tests and coverage
        run: $NICE deno task test:coverage

      - name: Profiling metric contract tests
        run: $NICE deno task test:perf

  python:
    name: Pipeline lint, type-check, unit tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      NICE: nice -n 15

    # The database-integration suite needs a real PostgreSQL, and the
    # local fixture brings one up under Apple's `container` runtime, which
    # is macOS-only -- so every one of those tests used to skip here and
    # column types, the JSON report round trip and `--export` from the
    # live pool were verified on a developer Mac or nowhere. On GitHub's
    # runners this service is what `CSVD_TEST_DB_URL` points the fixture at;
    # it is created and destroyed with the job, holds nothing, and publishes
    # on whatever host port is free. On the mini PC (vars.CI_RUNNER) no
    # service starts: the runner's own .env names a database of its own on
    # the machine's native PostgreSQL (the `ci-runner` skill). A service there
    # gave each job a Docker network that appeared and vanished mid-run, and
    # Chromium in a concurrent e2e job aborted page loads on the change
    # (net::ERR_NETWORK_CHANGED). Docker probes it every
    # second while it starts: with only the 10-second interval, the first
    # probe came 10 s in and the runner's back-off noticed "healthy" at 15 s,
    # though PostgreSQL accepts connections within two. Failures inside the
    # start period do not count against the retries, so a slow first start
    # cannot mark it unhealthy. --health-start-interval needs Docker 25.
    services:
      postgres:
        image: ${{ vars.CI_RUNNER == '' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: csvd_ci
          POSTGRES_PASSWORD: csvd_ci
          POSTGRES_DB: csvd_ci
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-start-period 30s
          --health-start-interval 1s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # A step rather than the job's env: the `job` context that names the
      # port Docker picked is not available there.
      - name: Point the database tests at the service
        if: vars.CI_RUNNER == ''
        run: echo "CSVD_TEST_DB_URL=postgresql://csvd_ci:csvd_ci@localhost:${{ job.services.postgres.ports['5432'] }}/csvd_ci" >> "$GITHUB_ENV"

      # The pipeline is a uv project. pyproject.toml pins requires-python, so
      # uv fetches the interpreter itself; --locked fails the build if uv.lock
      # has drifted from pyproject.toml rather than silently re-resolving.
      # Docling is a core dependency, so this installs it — which is what lets
      # tests/pipeline/test_pdf_parse.py exercise the real converter
      # configuration rather than skipping it, as it did while docling sat
      # behind an optional extra. torch comes from the PyTorch CPU index (see
      # [tool.uv.sources]), so the runner pulls roughly 200 MB instead of the
      # ~2.5 GB of CUDA wheels PyPI's default torch would drag in. The cache
      # goes through GitHub's cache service on a hosted runner only: a
      # self-hosted one keeps uv's cache on its own disk between jobs, and
      # restoring it over the machine's uplink would be slower than not.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}

      - name: Install dependencies
        run: uv sync --locked --group dev --group figure

      - name: Lint
        run: $NICE uv run ruff check .

      - name: Type-check
        run: $NICE uv run ty check

      # Measure both the importable package and Alembic's non-package scripts.
      # pyproject enforces the 99.5% line+branch coverage floor.
      # `-n auto --maxprocesses=4` spreads it over at most four xdist workers,
      # each migrating a database of its own (tests/xdist_databases.py).
      - name: Unit tests and coverage
        run: >-
          $NICE uv run pytest -n auto --maxprocesses=4
          --cov=pipeline
          --cov=pipeline/alembic
          --cov-branch
          --cov-report=term-missing:skip-covered

      # testpaths is tests/pipeline, so the print-figure suites are not
      # collected by the run above and have to be named. They pin the two
      # figures' layout against the committed data -- the same numbers
      # tests/phenogram_layout_test.ts and tests/timeline_layout_test.ts pin
      # on the island side -- so without this step a change to either script
      # reaches main unrun. The figure group installed above is what they
      # importorskip on; no database, no network.
      - name: Print-figure tests
        run: $NICE uv run pytest tests/scripts

  e2e:
    name: End-to-end
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      E2E_WORKERS: ${{ vars.CI_RUNNER && '4' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Playwright's runner is a Node program and lives in e2e/ with its own
      # package.json, deliberately isolated from the Deno-managed node_modules
      # at the repo root. npm's cache goes through GitHub's cache service on a
      # hosted runner only, as uv's does in the python job.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: deno install

      # --with-deps installs Chromium's system packages through sudo apt-get.
      # A self-hosted runner has no sudo; its machine got those packages once,
      # from an admin shell, and gets them again after a Playwright upgrade
      # (the `ci-runner` skill). The browser itself is cached in either case.
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      # playwright.config.ts builds the app and serves it with `deno serve`
      # via its webServer block, so there is no separate build step here.
      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # The check that a repository generated for another disease starts green:
  # what the new-disease skill does to a fresh fork -- empty data, the
  # four csvd/ test trees removed -- and then every gate the three jobs above
  # run. `git rm` rather than `rm -rf` because it is the command the skill
  # runs, and a tracked file it left behind is what the greplists would find.
  # `--ignore-unmatch` is for the fork itself: there the trees are already
  # gone, and this job goes on proving its own tests hold on empty data.
  #
  # One job per gate family, side by side: run in a row, Deno, Python and
  # Playwright made this the longest chain in the workflow. Each family
  # empties the data itself, then runs only its own gates. The postgres
  # service starts for the Python family alone, and only on GitHub's runners
  # (see the python job) -- an empty image starts no service -- and fail-fast
  # is off so one family's failure does not hide another's result.
  empty-data:
    name: A fork starts green, ${{ matrix.family }} (empty data, no cSVD tests)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        family: [deno, python, e2e]
    env:
      NICE: ${{ matrix.family != 'e2e' && 'nice -n 15' || '' }}
      E2E_WORKERS: ${{ vars.CI_RUNNER && '4' || '' }}

    services:
      postgres:
        image: ${{ matrix.family == 'python' && vars.CI_RUNNER == '' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: csvd_ci
          POSTGRES_PASSWORD: csvd_ci
          POSTGRES_DB: csvd_ci
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-start-period 30s
          --health-start-interval 1s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Point the database tests at the service
        if: matrix.family == 'python' && vars.CI_RUNNER == ''
        run: echo "CSVD_TEST_DB_URL=postgresql://csvd_ci:csvd_ci@localhost:${{ job.services.postgres.ports['5432'] }}/csvd_ci" >> "$GITHUB_ENV"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}

      - uses: actions/setup-node@v7
        if: matrix.family == 'e2e'
        with:
          node-version: 26
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: e2e/package-lock.json

      # Every family installs both: the empty export is written by Python and
      # every gate needs the Deno side.
      - name: Install dependencies
        run: |
          deno install
          uv sync --locked --group dev --group figure

      - name: Empty the data and remove the cSVD test trees
        run: |
          deno task data:empty
          git rm -r -q --ignore-unmatch tests/csvd e2e/tests/csvd tests/pipeline/csvd tests/scripts/csvd

      - name: Check
        if: matrix.family == 'deno'
        run: $NICE deno task check

      - name: Unit tests and coverage
        if: matrix.family == 'deno'
        run: $NICE deno task test:coverage

      - name: Lint
        if: matrix.family == 'python'
        run: $NICE uv run ruff check .

      - name: Type-check
        if: matrix.family == 'python'
        run: $NICE uv run ty check

      - name: Pipeline tests and coverage
        if: matrix.family == 'python'
        run: >-
          $NICE uv run pytest -n auto --maxprocesses=4
          --cov=pipeline
          --cov=pipeline/alembic
          --cov-branch
          --cov-report=term-missing:skip-covered

      - name: Print-figure tests
        if: matrix.family == 'python'
        run: $NICE uv run pytest tests/scripts

      - name: Install Playwright
        if: matrix.family == 'e2e'
        working-directory: e2e
        run: |
          npm ci
          npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: End-to-end tests on empty data
        if: matrix.family == 'e2e'
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.family == 'e2e' }}
        with:
          name: playwright-report-empty-data
          path: e2e/playwright-report/
          retention-days: 7

  adapt-fork:
    name: A fork the adapt wizard starts is green (${{ matrix.shard }}/2, ${{ matrix.family }})
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    # The empty-data job keeps this repository's disease/, so a failure only
    # a fork meets -- an escaped manifest string, one disease's glossary
    # pinned in a generic test, a two-letter abbreviation in the literal
    # scans, one trial population -- cannot surface there. This unpacks two
    # wizard bundles over copies of the tree and runs every check on each.
    # It runs in the fork itself too, whose checkout already followed the
    # checklist: the script's steps hold on a tree that carries them, as
    # `--ignore-unmatch` does for the job above, and its gates run with
    # GOLD_ONLY off, which is how a fork runs.
    #
    # One job per fork and gate family, side by side: run one after the other
    # they made this the slowest job in the workflow by minutes. The script
    # shards by position, so a third answer set lands in a leg without this
    # matrix changing, and --only picks the family. Under --e2e the fork's own
    # production build is the one Playwright's web server makes, so the Deno
    # family does not build it a second time. fail-fast is off so one job's
    # failure does not hide another's result.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        family: [deno, python, e2e]
    env:
      NICE: ${{ matrix.family != 'e2e' && 'nice -n 15' || '' }}
      E2E_WORKERS: ${{ vars.CI_RUNNER && '4' || '' }}

    services:
      postgres:
        image: ${{ matrix.family == 'python' && vars.CI_RUNNER == '' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: csvd_ci
          POSTGRES_PASSWORD: csvd_ci
          POSTGRES_DB: csvd_ci
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-start-period 30s
          --health-start-interval 1s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Point the database tests at the service
        if: matrix.family == 'python' && vars.CI_RUNNER == ''
        run: echo "CSVD_TEST_DB_URL=postgresql://csvd_ci:csvd_ci@localhost:${{ job.services.postgres.ports['5432'] }}/csvd_ci" >> "$GITHUB_ENV"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}

      - uses: actions/setup-node@v7
        if: matrix.family == 'e2e'
        with:
          node-version: 26
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: e2e/package-lock.json

      # Every family installs both: the empty export is written by Python and
      # every gate needs the Deno side.
      - name: Install dependencies
        run: |
          deno install
          uv sync --locked --group dev --group figure

      - name: Install Playwright
        if: matrix.family == 'e2e'
        run: |
          npm ci --prefix e2e
          npx --prefix e2e playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Run the checks on a wizard-made fork
        run: $NICE deno run -A scripts/adapt_fork_check.ts --e2e --shard=${{ matrix.shard }}/2 --only=${{ matrix.family }}

  # The image Fly.io runs, built and checked from outside on every push and
  # pull request, so a change to the Dockerfile, to .dockerignore's allowlist
  # or to anything the build imports cannot reach a deploy unrun. The smoke
  # secrets are throwaway: the container holds nothing and goes with the job.
  # A second container with no secrets has to fail the smoke script, which is
  # what shows the script would catch a production deploy missing one. On a
  # push to main this job also holds the real FLY_API_TOKEN, to push the image
  # below, which is why it stays on GitHub's runners.
  container:
    name: Production image builds and answers
    runs-on: ubuntu-latest

    env:
      SMOKE_PASSPHRASE: ci smoke passphrase

    steps:
      - uses: actions/checkout@v7

      # The Fly machine is x86_64; the platform is stated so the image cannot
      # change architecture with the runner it is built on.
      - name: Build the image
        run: docker build --platform linux/amd64 -t dashboard .

      # The configured container gets the session volume as Fly gives it: a
      # fresh named volume mounts with its root owned by root, as Fly's does,
      # so the smoke test's save and resume prove the entrypoint hands the
      # directory to `deno`. The unconfigured one has no volume and no
      # ADAPT_SESSIONS_DIR, and its expectation is unchanged. The volumeless
      # one names the directory but mounts nothing there, as a fork that drops
      # [mounts] and keeps the variable would.
      - name: Start it, configured and not
        run: |
          docker volume create session-storage
          docker run -d --name configured -p 8000:8000 \
            -v session-storage:/session_storage \
            -e ADAPT_SESSIONS_DIR=/session_storage/adapt-sessions \
            -e DASHBOARD_PASSPHRASE="$SMOKE_PASSPHRASE" \
            -e DASHBOARD_SESSION_SECRET=ci-smoke-session-secret \
            -e LOGIN_CLIENT_IP_HEADER=Fly-Client-IP \
            dashboard
          docker run -d --name unconfigured -p 8001:8000 dashboard
          docker run -d --name volumeless -p 8002:8000 \
            -e ADAPT_SESSIONS_DIR=/session_storage/adapt-sessions \
            -e DASHBOARD_PASSPHRASE="$SMOKE_PASSPHRASE" \
            -e DASHBOARD_SESSION_SECRET=ci-smoke-session-secret \
            dashboard
          for port in 8000 8001 8002; do
            for _ in $(seq 1 30); do
              curl -fsS -o /dev/null "http://localhost:$port/login" && break
              sleep 1
            done
          done

      - name: Smoke test the configured image
        env:
          SMOKE_EXPECT_SESSIONS: "1"
        run: scripts/smoke_deploy.sh http://localhost:8000

      # The entrypoint starts as root to own the session directory, then
      # execs tini, which runs the server as `deno`: the first process is tini
      # (root, as in the base image), and the server, its child, must not be
      # root. The entrypoint itself must be root's and writable by root alone,
      # or the user it drops to could change what root runs next start.
      - name: The server does not run as root, and only root can change its entrypoint
        run: |
          init=$(docker exec configured cat /proc/1/comm)
          echo "the first process: $init"
          if [ "$init" != tini ]; then
            echo "::error::the first process is $init, want tini"
            exit 1
          fi
          uids=$(docker exec configured sh -c '
            for p in /proc/[0-9]*; do
              [ "$(cat "$p/comm" 2>/dev/null)" = deno ] && grep "^Uid:" "$p/status"
            done; true' | awk '{ print $2 }' | sort -u)
          echo "the server's uids: $uids"
          if [ -z "$uids" ] || printf '%s\n' "$uids" | grep -qx 0; then
            echo "::error::the server process runs as root, or was not found (uids: ${uids:-none})"
            exit 1
          fi
          owner=$(docker exec configured stat -c '%U %a' /usr/local/bin/docker-entrypoint.sh)
          echo "the entrypoint: $owner"
          if [ "$owner" != "root 755" ]; then
            echo "::error::the entrypoint is $owner, want root 755"
            exit 1
          fi

      - name: The smoke test fails an image missing its secrets
        run: |
          if SMOKE_PASSPHRASE= scripts/smoke_deploy.sh http://localhost:8001; then
            echo "::error::the smoke test passed a server with no login secrets"
            exit 1
          fi

      # Root must not create the directory on the container's own filesystem,
      # where sessions would report as on and vanish at every restart: with no
      # volume the entrypoint leaves it uncreated and says so, and the page,
      # signed in, reports sessions off.
      - name: Sessions stay off when no volume is mounted
        run: |
          if docker exec volumeless test -e /session_storage/adapt-sessions; then
            echo "::error::the entrypoint created the sessions directory with no volume mounted"
            exit 1
          fi
          if ! docker logs volumeless 2>&1 | grep -q 'docker-entrypoint: nothing is mounted at /session_storage/adapt-sessions'; then
            echo "::error::the entrypoint did not say that nothing is mounted"
            exit 1
          fi
          if SMOKE_EXPECT_SESSIONS=1 scripts/smoke_deploy.sh http://localhost:8002 2>"$RUNNER_TEMP/smoke.err"; then
            echo "::error::GET /adapt reported sessions on with no volume mounted"
            exit 1
          fi
          cat "$RUNNER_TEMP/smoke.err"
          grep -q 'GET /adapt says sessions are off' "$RUNNER_TEMP/smoke.err"

      - name: Container logs
        if: ${{ !cancelled() }}
        run: |
          docker logs configured
          docker logs unconfigured
          docker logs volumeless

      # On a push to main, the image that just passed both smoke tests is the
      # one that goes live: pushed to the app's registry under the commit, so
      # deploy below releases it rather than having Fly build a second one --
      # which takes Fly's remote build (18-38 s on the deploys before this,
      # mostly waiting for a builder) off the time from push to live. The token
      # enters only the push step, and only on main: a pull request's run
      # never holds it, and a repository without it pushes nothing.
      - name: Check for a Fly.io token
        id: fly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: echo "token=${FLY_API_TOKEN:+yes}" >> "$GITHUB_OUTPUT"

      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: steps.fly.outputs.token == 'yes'

      - name: Push the smoke-tested image to Fly.io
        if: steps.fly.outputs.token == 'yes'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(sed -n 's/^app = "\(.*\)"$/\1/p' fly.toml)
          flyctl auth docker
          docker tag dashboard "registry.fly.io/$app:$GITHUB_SHA"
          docker push "registry.fly.io/$app:$GITHUB_SHA"

  # Fly.io deploys what every gate above passed, on a push to main and on
  # nothing else. FLY_API_TOKEN is a repository secret (`fly tokens create
  # deploy`); a repository without it -- a fork that hosts elsewhere, or the
  # second of this project's two remotes -- skips the deploy instead of
  # failing. --ha=false keeps a first deploy from creating Fly's default two
  # machines: the login limiter counts in the process, so there must be one.
  # It releases the image container pushed for this commit, so what goes live
  # is byte for byte the image the smoke test passed.
  deploy:
    name: Deploy to Fly.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, python, e2e, empty-data, adapt-fork, container]
    runs-on: ubuntu-latest

    concurrency:
      group: fly-deploy
      cancel-in-progress: false

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Skip without a Fly.io token
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN is not set in this repository; nothing was deployed."

      - uses: actions/checkout@v7
        if: env.FLY_API_TOKEN != ''

      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: env.FLY_API_TOKEN != ''

      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: |
          app=$(sed -n 's/^app = "\(.*\)"$/\1/p' fly.toml)
          flyctl deploy --image "registry.fly.io/$app:$GITHUB_SHA" --ha=false

      # Logged-out checks, unless the repository holds the live passphrase as
      # the SMOKE_PASSPHRASE secret. Fly's own health check is liveness on
      # /login, which renders even with a login secret unset, so the smoke
      # script's GET / is what turns such a deploy red here.
      #
      # A fly.toml that mounts a volume and names ADAPT_SESSIONS_DIR means
      # the adapt guide's sessions should be on, so the smoke test also saves
      # and resumes one, and a volume that is missing or unwritable fails the
      # deploy instead of quietly serving the guide without sessions. That
      # check has to sign in, so without SMOKE_PASSPHRASE the deploy says it
      # was skipped in a notice. A fork that removed either line keeps its
      # smoke test as it was.
      - name: Smoke test the live site
        if: env.FLY_API_TOKEN != ''
        env:
          SMOKE_PASSPHRASE: ${{ secrets.SMOKE_PASSPHRASE }}
        run: |
          app=$(sed -n 's/^app = "\(.*\)"$/\1/p' fly.toml)
          if grep -q '^\[mounts\]' fly.toml && grep -q '^ *ADAPT_SESSIONS_DIR *=' fly.toml; then
            if [ -n "$SMOKE_PASSPHRASE" ]; then
              export SMOKE_EXPECT_SESSIONS=1
            else
              echo "::notice::Not checked: that the live site can save and resume an adapt session (its volume is present and writable). To check it on every deploy, add the live passphrase as the repository secret SMOKE_PASSPHRASE."
            fi
          fi
          scripts/smoke_deploy.sh "https://$app.fly.dev"
